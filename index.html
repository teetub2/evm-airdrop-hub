<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVM Airdrop Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0e16;color:#e9edf7;font:15px system-ui}main{max-width:1000px;margin:auto;padding:28px}header{font-weight:900;letter-spacing:2px}em{color:#c5ff43;font-style:normal}section{background:#131c27;border:1px solid #303b49;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:clamp(32px,6vw,56px);margin:10px 0}p,small{color:#a4afbf}button,input{font:inherit;border-radius:8px;padding:12px;border:1px solid #43505f}button{background:#c5ff43;color:#111;font-weight:bold;cursor:pointer}input{background:#080d14;color:white;width:min(100%,560px)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}article{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-top:1px solid #303b49}span{color:#a4afbf}#saved button{margin:5px}#message{overflow-wrap:anywhere}</style><main><header>AIRDROP<em>HUB</em></header><nav><button onclick="show('checker')">Wallet Checker</button><button onclick="show('discover')">Discover</button><button onclick="show('wallets')">My Wallets</button></nav><section><small>READ-ONLY EVM INTELLIGENCE</small><h1>Never miss your <em>next airdrop.</em></h1><p>Six EVM networks. No signatures or private keys required.</p></section><section id="checker"><h2>Unclaimed Airdrop Finder</h2><input id="address" placeholder="Public wallet address (0x...)" aria-label="Wallet address"><button id="check" onclick="run()">Check</button> <button onclick="save()">Save wallet</button><p id="message" role="status"></p></section><section id="discover"><h2>Project directory</h2><p>Preview catalog only. No verified live airdrops connected yet.</p><div id="rows"></div></section><section id="wallets" hidden><h2>Saved wallets</h2><div id="saved"></div></section></main><script>const $=id=>document.getElementById(id);let projects=[],results=[];function show(tab){$('checker').hidden=tab!=='checker';$('discover').hidden=tab==='wallets';$('wallets').hidden=tab!=='wallets';if(tab==='wallets')saved()}function render(){ $('rows').replaceChildren();for(const p of projects){const row=document.createElement('article'),name=document.createElement('strong'),status=document.createElement('span');name.textContent=p.name+' · Example';status.textContent=results.find(r=>r.projectId===p.id)?.status||'Not checked';row.append(name,status);$('rows').append(row)}}fetch('/api/projects').then(r=>r.json()).then(d=>{projects=d.projects;render()}).catch(()=>{$('message').textContent='Catalog unavailable'});async function run(){ $('check').disabled=true;try{const r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:$('address').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error);results=d.results;render();$('message').textContent='No verified eligibility sources configured. Results are unknown, not ineligible.'}catch(e){$('message').textContent=e.message}finally{$('check').disabled=false}}function wallets(){try{return JSON.parse(localStorage.getItem('wallets')||'[]')}catch{return []}}function save(){const a=$('address').value.trim();if(!/^0x[0-9a-fA-F]{40}$/.test(a))return $('message').textContent='Invalid address';localStorage.setItem('wallets',JSON.stringify([...new Set([...wallets(),a])].slice(0,20)));$('message').textContent='Saved locally'}function saved(){$('saved').replaceChildren();for(const a of wallets()){const b=document.createElement('button');b.textContent=a;b.onclick=()=>{$('address').value=a;show('checker');run()};$('saved').append(b)}}</script></html>
